<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Request a delivery · Mr. Delivery Man</title>
<meta name="description" content="Request a pickup or a shopping run in Malé, Hulhumalé and the airport. Add your packages, pick a time, pay by bank transfer and track the rider to the door.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111114'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Inter,system-ui,sans-serif' font-weight='600' font-size='18' fill='%23fff'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="./page.css">
<script defer src="../js/mdm.js"></script>
<script defer src="../js/icons.js"></script>
<script defer src="../js/store.js"></script>
<script defer src="../js/roads.js"></script>
<script defer src="../js/geo.js"></script>
<script defer src="../js/pricing.js"></script>
<script defer src="../js/map.js"></script>
<script defer src="../js/live.js"></script>
<script defer src="../js/ui.js"></script>
<script defer src="../js/shell.js"></script>
<script defer src="../js/package-editor.js"></script>
<script defer src="../js/seed.js"></script>
<script defer src="./page.js"></script>
</head>
<body class="page-request" data-page="request">
<a class="sr-only" href="#main">Skip to content</a>
<header data-shell="public"></header>
<main id="main">
  <div class="container">
    <div class="page-head">
      <h1>Request a delivery</h1>
      <p class="page-head__desc">Tell us what to pick up and where it goes. You pay by bank transfer, then track the rider to the door.</p>
    </div>
    <div class="request-layout">
      <form data-testid="request-form" class="request-form" novalidate autocomplete="on">
        <ol class="stepper" data-testid="request-stepper" aria-label="Steps"></ol>
        <section class="request-step" id="request-step-1" data-step="1" aria-labelledby="request-step-1-title" hidden></section>
        <section class="request-step" id="request-step-2" data-step="2" aria-labelledby="request-step-2-title" hidden></section>
        <section class="request-step" id="request-step-3" data-step="3" aria-labelledby="request-step-3-title" hidden></section>
        <section class="request-step" id="request-step-4" data-step="4" aria-labelledby="request-step-4-title" hidden></section>
      </form>
      <aside class="request-layout__panel" aria-label="Your request" data-testid="request-panel"></aside>
    </div>
  </div>
  <div class="mobile-bar" data-testid="request-mobile-bar"></div>
</main>
<footer data-shell="public-footer"></footer>
</body>
</html>
